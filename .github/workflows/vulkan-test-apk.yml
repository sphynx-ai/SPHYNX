name: Vulkan test APK

# Phase 8, step G8 (owner decision 2026-11-25, option 2): GitHub's computer builds a TEST APK with llama.cpp's Vulkan GPU
# backend, which the phone build can't make (the NDK has the shader compiler glslc only for desktop computers). The owner
# downloads it once from this run's artifacts and installs it next to the normal app (id com.sphynx.vulkantest, version
# ending in -vulkan-test) to run the GGUF benchmark on the GPU. The normal app stays CPU-only.
on:
  push:
    branches: [sphynx-test-branch]
    paths: ['app/src/main/cpp/**', '.github/workflows/vulkan-test-apk.yml', 'app/build.gradle.kts']
  pull_request:
    paths: ['app/src/main/cpp/**', '.github/workflows/vulkan-test-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-test-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulkan-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages (same versions as the normal build)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Shader compiler, Vulkan and SPIR-V headers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q glslc ninja-build > /dev/null
          T="$RUNNER_TEMP"
          VKTAG=$(git ls-remote --tags https://github.com/KhronosGroup/Vulkan-Headers.git | awk -F'refs/tags/' '{print $2}' | grep -E '^v1\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Vulkan-Headers $VKTAG"
          git clone -q --depth 1 --branch "$VKTAG" https://github.com/KhronosGroup/Vulkan-Headers.git "$T/vulkan-headers"
          git clone -q --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git "$T/spirv-src"
          cmake -S "$T/spirv-src" -B "$T/spirv-build" -DCMAKE_INSTALL_PREFIX="$T/spirv" -DSPIRV_HEADERS_ENABLE_TESTS=OFF > /dev/null
          cmake --install "$T/spirv-build" > /dev/null
          echo "SPHYNX_VULKAN_INCLUDE=$T/vulkan-headers/include" >> "$GITHUB_ENV"
          echo "SPHYNX_GLSLC=$(command -v glslc)" >> "$GITHUB_ENV"
          echo "SPHYNX_SPIRV_HEADERS_DIR=$(dirname "$(find "$T/spirv" -name SPIRV-HeadersConfig.cmake | head -1)")" >> "$GITHUB_ENV"

      - name: ggml-vulkan sources from the pinned llama.cpp tag
        run: |
          TAG=$(sed -n 's/^set(LLAMA_PIN_TAG *"\([^"]*\)").*/\1/p' app/src/main/cpp/CMakeLists.txt)
          echo "llama.cpp $TAG"
          git clone -q --depth 1 --filter=blob:none --sparse --branch "$TAG" https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama"
          git -C "$RUNNER_TEMP/llama" sparse-checkout set ggml/src/ggml-vulkan
          cp -r "$RUNNER_TEMP/llama/ggml/src/ggml-vulkan" app/src/main/cpp/llama.cpp/ggml/src/

      - name: Build the Vulkan test APK
        run: ./gradlew --no-daemon -PsphynxVulkan=true assembleDebug

      - name: Upload the test APK
        uses: actions/upload-artifact@v4
        with:
          name: sphynx-vulkan-test-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
