name: Lifecycle tests (emulator)

# Phase 5 (owner, 2026-11-21): the lifecycle checks an emulator can run (app/src/androidTest; checklist in
# docs/PHASE_5_RELIABILITY_AUDIT.md section 8). Separate from "Android build", which stays the merge check of the
# test-branch workflow; this one reports next to it. The x86_64 emulator runs the app without the GGUF engine (built
# for arm64-v8a only), which the app refuses with a reason, as on any phone without it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages (platform 36, build-tools 36.0.0, NDK 29.0.14206865, CMake 3.22.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      # hardware acceleration for the emulator on GitHub's Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the app and its instrumented tests
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest

      - name: Run the lifecycle tests on an emulator (Android 12, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-test-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
          retention-days: 14
