name: Android build

# Builds the debug APK and runs the JVM unit tests on every pull request and
# every push to main, so a change that breaks compilation or a test is seen
# before it is merged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v4

      # NDK and CMake: the exact versions Code on the Go has on the owner's phone (llama.cpp is built
      # from app/src/main/cpp); see app/build.gradle.kts
      - name: Install Android SDK packages (platform 36, build-tools 36.0.0, NDK 29.0.14206865, CMake 3.22.1)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1" > /dev/null

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      # Owner-approved: golden-image tests read the reference screenshots from the
      # reference-assets branch at test time (no screenshots are committed to main).
      # If the branch cannot be fetched, those tests skip; all other tests still run.
      - name: Fetch reference library (reference-assets branch)
        run: |
          mkdir -p "$RUNNER_TEMP/reference"
          if git fetch --depth=1 origin reference-assets; then
            git archive FETCH_HEAD reference-library | tar -x -C "$RUNNER_TEMP/reference"
            echo "REFERENCE_LIBRARY_DIR=$RUNNER_TEMP/reference/reference-library" >> "$GITHUB_ENV"
          else
            echo "reference-assets not available: golden-image tests will be skipped"
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  # Phase 8, step G3: the app's real native engine (llama_engine.cpp + the vendored llama.cpp) built for this computer and
  # run against a tiny random GGUF model made with llama.cpp's own gguf-py: load, streaming, greedy repeat, cancel (also
  # from another thread), errors, a picture without an mmproj, and 20 loads and frees. No model download.
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install build tools and numpy (Ubuntu packages)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build cmake python3-numpy python3-yaml > /dev/null

      - name: Build and run the native engine test
        env:
          REQUIRE_MODEL: "1"
        run: tools/native-test/run.sh --tiny
