name: Bug report
description: Report a reproducible problem in Sphynx.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Report bugs with enough detail to reproduce them. Do not include API keys, passwords, or private data."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open... 2. Start... 3. Observe..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: "e.g. v37.x or commit SHA"
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove personal information and secrets before posting.
