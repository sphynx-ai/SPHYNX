<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sphynx Setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#7FA2FF}a:hover{color:#A9C0FF}
</style>
</helmet>
<div style="width: 390px; height: 1180px; box-sizing: border-box; background: #0B0D10; color: #C9CED6; font-family: Inter, sans-serif; display: flex; flex-direction: column;">
  <header style="height: 64px; padding: 0 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #3A414D;">
    <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="8" fill="#1B1F26"/><path d="M18 6 L30 18 L18 30 L6 18 Z" fill="none" stroke="#F4F6F8" stroke-width="3"/><path d="M18 14 L22 18 L18 22 L14 18 Z" fill="#35C2B0"/></svg>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <span style="font-family: 'Pixelify Sans', monospace; font-size: 20px; color: #F4F6F8;">Sphynx</span>
      <span style="font-size: 13px; color: #9AA3AF;">AI off</span>
    </div>
    <button style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: #C8303F; color: #FFFFFF; font: 600 15px Inter, sans-serif; display: flex; align-items: center; gap: 8px;"><svg width="12" height="12" aria-hidden="true"><rect width="12" height="12" rx="2" fill="#FFFFFF"/></svg>STOP</button>
  </header>

  <div role="tablist" aria-label="Settings and help" style="margin: 12px 16px 0; padding: 4px; background: #1B1F26; border: 1px solid #3A414D; border-radius: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px;">
    <a href="Setup.dc.html" style="min-height: 44px; border-radius: 10px; background: #F4F6F8; color: #0B0D10; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 14px Inter, sans-serif;">Setup</a>
    <a href="#" style="min-height: 44px; border-radius: 10px; color: #C9CED6; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 500 14px Inter, sans-serif;">Help &amp; data</a>
    <a href="#" style="min-height: 44px; border-radius: 10px; color: #C9CED6; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 500 14px Inter, sans-serif;">What's new</a>
  </div>

  <main style="flex-grow: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden;">
    <section style="background: #1B1F26; border: 1px solid #3A414D; border-radius: 16px; padding: 16px; display: flex; flex-direction: column;">
      <h2 style="margin: 0 0 6px; font-family: 'Pixelify Sans', monospace; font-size: 17px; font-weight: 600; color: #F4F6F8;">Permissions</h2>
      <sc-for list="{{perms}}" as="p" hint-placeholder-count="5">
        <div style="min-height: 56px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #252B35;">
          <sc-if value="{{p.ok}}" hint-placeholder-val="{{true}}">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#3DD68C" stroke-width="2"/><path d="M5.5 9.2l2.3 2.3 4.7-4.8" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linecap="round"/></svg>
          </sc-if>
          <sc-if value="{{p.missing}}" hint-placeholder-val="{{false}}">
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="7" fill="none" stroke="#FF6B78" stroke-width="2"/><path d="M9 5v5M9 12.5v.5" stroke="#FF6B78" stroke-width="2" stroke-linecap="round"/></svg>
          </sc-if>
          <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 15px; color: #F4F6F8;">{{p.name}}</span>
            <span style="font-size: 13px; color: {{p.color}};">{{p.word}}</span>
          </span>
          <sc-if value="{{p.missing}}" hint-placeholder-val="{{false}}">
            <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #737B88; background: #252B35; color: #C9CED6; font: 500 15px Inter, sans-serif;">Fix</button>
          </sc-if>
          <button aria-label="Help: {{p.name}}" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center;"><span style="width: 22px; height: 22px; border-radius: 11px; border: 1px solid #9AA3AF; color: #9AA3AF; font: 600 12px Inter, sans-serif; display: flex; align-items: center; justify-content: center;">?</span></button>
        </div>
      </sc-for>
    </section>

    <section style="background: #1B1F26; border: 1px solid #3A414D; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 17px; font-weight: 600; color: #F4F6F8;">Calibrate buttons</h2>
      <sc-for list="{{layouts}}" as="l" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="flex-grow: 1; display: flex; flex-direction: column;">
            <span style="font-size: 15px;">{{l.name}}</span>
            <span style="font-size: 13px; color: {{l.color}};">{{l.state}}</span>
          </span>
          <button style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #737B88; background: #252B35; color: #C9CED6; font: 500 15px Inter, sans-serif;">Calibrate</button>
        </div>
      </sc-for>
    </section>

    <section style="background: #1B1F26; border: 1px solid #3A414D; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
      <h2 style="margin: 0; font-family: 'Pixelify Sans', monospace; font-size: 17px; font-weight: 600; color: #F4F6F8;">Scenery &amp; minimap sync</h2>
      <button style="height: 52px; border: 0; border-radius: 12px; background: #F4F6F8; color: #0B0D10; font: 600 16px Inter, sans-serif;">Sync now</button>
      <button style="min-height: 48px; border-radius: 12px; border: 1px solid #FF6B78; background: #252B35; color: #FF6B78; font: 500 14px Inter, sans-serif; text-align: left; padding: 0 14px;">Reset sync offsets</button>
      <button style="min-height: 48px; border-radius: 12px; border: 1px solid #FF6B78; background: #252B35; color: #FF6B78; font: 500 14px Inter, sans-serif; text-align: left; padding: 0 14px;">Clear saved map scenery</button>
    </section>
  </main>

  <nav aria-label="Main" style="height: 64px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; padding: 6px 8px; background: #1B1F26; border-top: 1px solid #3A414D; box-sizing: border-box;">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="border-radius: 20px; background: {{t.bg}}; color: {{t.fg}}; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: 'Pixelify Sans', monospace; font-size: 11px; min-height: 48px;">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="{{t.icon}}" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const tabs = [
      { label: 'Play', href: 'Main.dc.html', icon: 'M6 4l10 6-10 6z' },
      { label: 'Hero & match', href: 'Hero.dc.html', icon: 'M10 3l7 3v5c0 4-3 6-7 7-4-1-7-3-7-7V6z' },
      { label: 'Knowledge', href: 'Library.dc.html', icon: 'M4 4h5a3 3 0 013 3v10a2 2 0 00-2-2H4zM16 4h-1a3 3 0 00-3 3' },
      { label: 'AI & models', href: 'Models.dc.html', icon: 'M6 6h8v8H6zM10 2v4M10 14v4M2 10h4M14 10h4' },
      { label: 'Settings', href: 'Setup.dc.html', icon: 'M10 7a3 3 0 100 6 3 3 0 000-6zM10 2v3M10 15v3M2 10h3M15 10h3' }
    ].map((t, i) => ({ ...t, bg: i === 4 ? '#F4F6F8' : 'transparent', fg: i === 4 ? '#0B0D10' : '#9AA3AF' }));
    const p = (name, ok) => ({ name, ok, missing: !ok, word: ok ? 'Granted' : 'Missing', color: ok ? '#3DD68C' : '#FF6B78' });
    return {
      tabs,
      perms: [p('Accessibility service', false), p('Display over other apps', true), p('Notifications', true), p('All files access', true), p('Screen capture (asked at start)', true)],
      layouts: [
        { name: '2-skill buttons', state: 'Default positions', color: '#F4C25B' },
        { name: '3-skill buttons', state: 'Calibrated', color: '#3DD68C' },
        { name: '4-skill buttons', state: 'Default positions', color: '#F4C25B' }
      ]
    };
  }
}
</script>
</body>
</html>
